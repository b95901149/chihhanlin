# push 到 main -> 用 Eleventy 建置 -> 部署到 GitHub Pages
# 前置：repo 的 Settings > Pages > Source 選 "GitHub Actions"。
# uploads/（圖片與附件，約 300 MB）必須在 repo 根目錄的 ./uploads（見 README「uploads 的放置方式」）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: uploads/ must exist
        run: |
          test -d uploads || { echo "::error::uploads/ is missing - copy chihhanlin-weebly/uploads into the repo root (see README)"; exit 1; }

      - name: Build
        run: npx @11ty/eleventy
        env:
          # project site: /<repo>/ ; user site (<user>.github.io): empty -> "/"
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
